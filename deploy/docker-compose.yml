name: mnemoscape

services:
  mysql:
    build:
      context: ./mysql
    container_name: mnemoscape-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mnemoscape-net

  redis:
    image: redis:7-alpine
    container_name: mnemoscape-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mnemoscape-net

  minio:
    image: minio/minio:latest
    container_name: mnemoscape-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnemoscape-net

  minio-init:
    image: minio/mc:latest
    container_name: mnemoscape-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set mnemoscape http://minio:9000 minioadmin minioadmin123;
      mc mb mnemoscape/mnemoscape-assets --ignore-existing;
      mc anonymous set private mnemoscape/mnemoscape-assets;
      echo 'MinIO bucket initialized';
      exit 0;
      "
    networks:
      - mnemoscape-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mnemoscape-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnemoscape-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mnemoscape-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mnemoscape-net

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: mnemoscape-sentinel
    ports:
      - "8858:8858"
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858"
    networks:
      - mnemoscape-net

  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: mnemoscape-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
    volumes:
      - seata-data:/seata-server/resources
    networks:
      - mnemoscape-net

  neo4j:
    image: neo4j:5-community
    container_name: mnemoscape-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mnemoscape-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: mnemoscape-etcd
    ports:
      - "2379:2379"
    command:
      - etcd
      - --name=mnemoscape-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://mnemoscape-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://mnemoscape-etcd:2380
      - --initial-cluster=mnemoscape-etcd=http://mnemoscape-etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=mnemoscape-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mnemoscape-net

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: mnemoscape-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin123
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mnemoscape-net

  # 分布式追踪试点：Jaeger all-in-one（含 collector + query + UI）。
  # api-gateway / ai-service 经 OTLP HTTP 上报 span（容器内用 http://jaeger:4318/v1/traces），
  # 链路查看地址 http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: mnemoscape-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP（服务端默认上报端点）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mnemoscape-net

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  nacos-data:
  seata-data:
  neo4j-data:
  neo4j-logs:
  etcd-data:
  milvus-data:

networks:
  mnemoscape-net:
    driver: bridge
