server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: memory-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:100.66.166.46}:3306/mnemoscape_memory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: MnemoscapeMemoryPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  neo4j:
    uri: bolt://${NEO4J_HOST:100.66.166.46}:7687
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password123}
  rabbitmq:
    host: ${RABBITMQ_HOST:100.66.166.46}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    # Redis connection used by admin-dashboard aggregation caches
    # (admin.active-users / memory-trends / emotion-distribution / heatmap /
    #  top-contributors / fragment-discovery — see AdminCacheConfig).
    # Pre-existing @Cacheable usages in MemoryService / MemoryLookup keep
    # using the Caffeine cache manager wired via spring.cache below, so this
    # block only governs the Redis-backed admin caches.
    redis:
      host: ${REDIS_HOST:100.66.166.46}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m
    cache-names: memories,driftStates
  cloud:
    inetutils:
      preferred-networks:
        - 172.
        - 100.
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:100.66.166.46}:8848
        enabled: true
        ip: ${SPRING_CLOUD_NACOS_DISCOVERY_IP:}
      config:
        enabled: false

# admin-dashboard (Requirements 3.2) — JWT secret is needed by the
# /api/v1/admin/** SecurityFilterChain to validate bearer tokens for
# direct service calls that bypass the gateway. Token-expiration values
# are unused on this side (memory-service never issues tokens) but the
# JwtTokenProvider constructor still requires them.
mnemoscape:
  jwt:
    secret: ${JWT_SECRET:bW5lbW9zY2FwZS1zZWNyZXQta2V5LWZvci1obWFjLXNoYTI1Ni1hbGdvcml0aG0tMjAyNQ==}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
  memory:
    geocoder:
      enabled: true
      # 开启 Nominatim 远程查询，让 ANCHORS 表未覆盖的地名也能解析坐标
      remote-enabled: true
      nominatim-base: https://nominatim.openstreetmap.org

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.mnemoscape.memory

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.mnemoscape: INFO
    org.hibernate.SQL: WARN
