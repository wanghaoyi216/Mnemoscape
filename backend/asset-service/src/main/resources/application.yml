server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: asset-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      host: ${REDIS_HOST:100.66.166.46}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3s
  # @Async 线程池配置。Asset 服务异步处理图片压缩/缩略图生成等任务，
  # 有界队列 + CALLER_RUNS 背压，避免高并发上传时任务堆积 OOM。
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: asset-async-
      shutdown:
        await-termination: true
        await-termination-period: 20s
  cloud:
    inetutils:
      preferred-networks:
        - 172.
        - 100.
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848
        enabled: true
        ip: ${SPRING_CLOUD_NACOS_DISCOVERY_IP:}
      config:
        enabled: false

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:mnemoscape-assets}
  presigned-ttl-seconds: ${MINIO_PRESIGNED_TTL_SECONDS:3600}

# JWT shared with auth-service / api-gateway. Required by SecurityConfig so the
# admin-scoped SecurityFilterChain can validate bearer tokens on
# /api/v1/admin/** when callers bypass the gateway (admin-dashboard R3.2).
mnemoscape:
  jwt:
    secret: ${JWT_SECRET:bW5lbW9zY2FwZS1zZWNyZXQta2V5LWZvci1obWFjLXNoYTI1Ni1hbGdvcml0aG0tMjAyNQ==}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.mnemoscape.asset

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,caches
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.mnemoscape: INFO
