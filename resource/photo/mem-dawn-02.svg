  <circle cx="800" cy="200" r="2" fill="#f2b95c" opacity="0.4"/>
  <circle cx="400" cy="150" r="2" fill="#f2b95c" opacity="0.3"/>
  <circle cx="1200" cy="180" r="2" fill="#f2b95c" opacity="0.3"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.5"/>
