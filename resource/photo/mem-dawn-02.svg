<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1005"/><stop offset="0.5" stop-color="#2a1a08"/><stop offset="1" stop-color="#0a0805"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.5" stop-color="black" stop-opacity="0"/>
      <stop offset="1" stop-color="black" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="grain">
