<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aurora veil">
  <defs>
    <radialGradient id="av-sky" cx="30%" cy="20%" r="120%">
      <stop offset="0%" stop-color="#0c2a3a"/>
      <stop offset="55%" stop-color="#071521"/>
      <stop offset="100%" stop-color="#03080e"/>
    </radialGradient>
    <linearGradient id="av-aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36d8b4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6cc6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9b7bff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="av-blur"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="av-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#av-sky)"/>
  <g filter="url(#av-blur)">
    <path d="M-100 380 C 250 240, 520 460, 760 300 S 1200 220, 1360 360 L 1360 -80 L -100 -80 Z" fill="url(#av-aurora)"/>
    <path d="M-100 520 C 300 420, 600 600, 900 470 S 1300 440, 1360 520 L 1360 320 L -100 320 Z" fill="#36d8b4" opacity="0.18"/>
    <ellipse cx="930" cy="170" rx="160" ry="160" fill="#6cc6ff" opacity="0.25"/>
  </g>
  <g fill="#f4f7fa">
    <circle cx="180" cy="140" r="1.6" opacity="0.8"/>
    <circle cx="420" cy="90" r="1.1" opacity="0.6"/>
    <circle cx="690" cy="160" r="1.3" opacity="0.7"/>
    <circle cx="1040" cy="120" r="1.5" opacity="0.75"/>
    <circle cx="300" cy="240" r="1" opacity="0.5"/>
    <circle cx="860" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="1120" cy="260" r="1" opacity="0.5"/>
  </g>
  <rect width="1200" height="800" filter="url(#av-grain)" opacity="0.6"/>
  <rect width="1200" height="800" fill="url(#av-sky)" opacity="0.12"/>
</svg>
