<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Violet tide">
  <defs>
    <radialGradient id="vt-bg" cx="70%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#2a1b4a"/>
      <stop offset="55%" stop-color="#160d2e"/>
      <stop offset="100%" stop-color="#070512"/>
    </radialGradient>
    <linearGradient id="vt-wave" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ff6eb4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9b7bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6cc6ff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="vt-blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="vt-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#vt-bg)"/>
  <g filter="url(#vt-blur)">
    <path d="M-80 560 C 240 460, 460 660, 720 540 S 1180 500, 1320 600 L 1320 880 L -80 880 Z" fill="url(#vt-wave)"/>
    <path d="M-80 660 C 300 580, 560 720, 880 620 S 1240 620, 1320 680 L 1320 880 L -80 880 Z" fill="#ff6eb4" opacity="0.22"/>
    <ellipse cx="300" cy="220" rx="200" ry="180" fill="#9b7bff" opacity="0.3"/>
  </g>
  <g fill="#f4f7fa">
    <circle cx="220" cy="160" r="1.4" opacity="0.7"/>
    <circle cx="520" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="800" cy="200" r="1.3" opacity="0.7"/>
    <circle cx="1080" cy="150" r="1.2" opacity="0.65"/>
    <circle cx="960" cy="320" r="1" opacity="0.5"/>
    <circle cx="160" cy="360" r="1" opacity="0.5"/>
  </g>
  <rect width="1200" height="800" filter="url(#vt-grain)" opacity="0.55"/>
</svg>
