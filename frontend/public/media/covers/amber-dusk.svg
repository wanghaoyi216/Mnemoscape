<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Amber dusk">
  <defs>
    <linearGradient id="ad-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1d22"/>
      <stop offset="45%" stop-color="#7a3b24"/>
      <stop offset="72%" stop-color="#c87b3c"/>
      <stop offset="100%" stop-color="#f2b95c"/>
    </linearGradient>
    <radialGradient id="ad-sun" cx="50%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#fff1d6" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f2b95c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2b95c" stop-opacity="0"/>
    </radialGradient>
    <filter id="ad-blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="ad-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#ad-sky)"/>
  <rect width="1200" height="800" fill="url(#ad-sun)"/>
  <g filter="url(#ad-blur)" opacity="0.5">
    <ellipse cx="240" cy="300" rx="300" ry="60" fill="#3a1d22" opacity="0.5"/>
    <ellipse cx="980" cy="240" rx="260" ry="50" fill="#7a3b24" opacity="0.4"/>
  </g>
  <g opacity="0.85">
    <path d="M0 640 L 1200 600 L 1200 800 L 0 800 Z" fill="#2a1118"/>
    <path d="M0 700 Q 300 660 600 700 T 1200 690 L 1200 800 L 0 800 Z" fill="#1a0a10"/>
  </g>
  <circle cx="600" cy="630" r="84" fill="#fff4dd" opacity="0.92"/>
  <circle cx="600" cy="630" r="84" fill="url(#ad-sun)"/>
  <rect width="1200" height="800" filter="url(#ad-grain)" opacity="0.5"/>
</svg>
