<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mint mist">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08221d"/>
      <stop offset="60%" stop-color="#0a1714"/>
      <stop offset="100%" stop-color="#04100c"/>
    </linearGradient>
    <radialGradient id="mm-glow" cx="40%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#36d8b4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#36d8b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="mm-blur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="mm-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#mm-bg)"/>
  <rect width="1200" height="800" fill="url(#mm-glow)"/>
  <g filter="url(#mm-blur)" opacity="0.8">
    <path d="M-100 460 Q 300 360 600 440 T 1300 420" stroke="#36d8b4" stroke-width="120" fill="none" opacity="0.18"/>
    <path d="M-100 560 Q 360 500 700 560 T 1300 540" stroke="#6cc6ff" stroke-width="90" fill="none" opacity="0.12"/>
    <ellipse cx="820" cy="280" rx="220" ry="200" fill="#14a98b" opacity="0.22"/>
  </g>
  <g fill="#eafff8">
    <circle cx="260" cy="180" r="1.3" opacity="0.6"/>
    <circle cx="560" cy="130" r="1.1" opacity="0.5"/>
    <circle cx="900" cy="190" r="1.2" opacity="0.6"/>
    <circle cx="1100" cy="240" r="1" opacity="0.5"/>
    <circle cx="380" cy="300" r="1" opacity="0.45"/>
  </g>
  <rect width="1200" height="800" filter="url(#mm-grain)" opacity="0.5"/>
</svg>
