<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abyss glow">
  <defs>
    <radialGradient id="ag-bg" cx="50%" cy="120%" r="120%">
      <stop offset="0%" stop-color="#0b3a55"/>
      <stop offset="45%" stop-color="#06202f"/>
      <stop offset="100%" stop-color="#020a12"/>
    </radialGradient>
    <linearGradient id="ag-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6cc6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6cc6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ag-blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="ag-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#ag-bg)"/>
  <g filter="url(#ag-blur)" opacity="0.7">
    <polygon points="280,-50 360,-50 520,500 200,500" fill="url(#ag-ray)"/>
    <polygon points="640,-50 760,-50 860,520 560,520" fill="url(#ag-ray)" opacity="0.7"/>
    <polygon points="980,-50 1040,-50 1120,480 900,480" fill="url(#ag-ray)" opacity="0.5"/>
  </g>
  <g filter="url(#ag-blur)">
    <ellipse cx="600" cy="760" rx="520" ry="160" fill="#0b3a55" opacity="0.5"/>
  </g>
  <g fill="#cfeeff">
    <circle cx="320" cy="420" r="2" opacity="0.7"/>
    <circle cx="760" cy="360" r="1.5" opacity="0.6"/>
    <circle cx="980" cy="440" r="1.8" opacity="0.65"/>
    <circle cx="520" cy="300" r="1.2" opacity="0.5"/>
    <circle cx="180" cy="260" r="1.4" opacity="0.55"/>
    <circle cx="1080" cy="300" r="1.2" opacity="0.5"/>
  </g>
  <rect width="1200" height="800" filter="url(#ag-grain)" opacity="0.55"/>
</svg>
