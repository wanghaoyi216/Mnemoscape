# Mnemoscape RabbitMQ container config.
# Loaded by rabbitmq:3.12-management-alpine on startup.
#
# 主要作用:
# 1) management.load_definitions  — 启动时自动加载 definitions.json 里的
#    exchanges / queues / bindings, 让六个服务无需手动声明拓扑.
# 2) loopback_users.guest = false — 允许 guest/guest 从非 localhost 登录
#    (笔记本端通过 Tailscale 100.x 直连 5672/15672 都要靠这个).

# 自动加载预定义拓扑
management.load_definitions = /etc/rabbitmq/definitions.json

# 关闭 guest 仅本地的限制 (Tailscale 内网开发环境)
loopback_users.guest = false

# 内存与磁盘
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# 连接保活
heartbeat = 30

# 默认队列类型为 classic (与 definitions.json 中保持一致)
default_queue_type = classic
