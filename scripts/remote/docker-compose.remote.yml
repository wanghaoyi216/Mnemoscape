# =============================================================================
# Mnemoscape — 工位电脑中间件 docker-compose
#
# 用法 (在工位电脑上,任何能调用 docker 的 shell 里都行):
#   cd D:\MnemoscapeInfra
#   docker compose -f docker-compose.remote.yml up -d
#
# 数据全部落在 D:\MnemoscapeInfra\<service>\ 下面,C 盘不会被写入.
#
# 所有服务都在同一个 bridge 网段 mnemoscape-infra-net 里,
# 容器之间通过服务名互相寻址 (比如 mysql、redis、nacos)。
# 主机暴露端口同时绑 0.0.0.0,所以你的笔记本 (Tailscale 100.66.166.46)
# 直连 100.66.166.46:3306 之类即可。
# =============================================================================

name: mnemoscape-infra

# --------- 共用基础设定 ------------------------------------------------------
x-restart: &restart-policy
  restart: unless-stopped

x-tz: &tz
  TZ: Asia/Shanghai

# ============================================================================
services:
# ----------------------------------------------------------------------------
# MySQL 8 — 三个业务库 mnemoscape_auth / mnemoscape_memory / mnemoscape_resonance
# 初始化 SQL 在 D:\MnemoscapeInfra\mysql\init\*.sql ,只在第一次空数据卷时跑
# ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mnemoscape-mysql
    <<: *restart-policy
    ports:
      - "3306:3306"
    environment:
      <<: *tz
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=400
      - --innodb_buffer_pool_size=512M
    volumes:
      - D:/MnemoscapeInfra/mysql/data:/var/lib/mysql
      - D:/MnemoscapeInfra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [infra-net]

# ----------------------------------------------------------------------------
# Redis 7 — 缓存、限流、会话存储
# ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mnemoscape-redis
    <<: *restart-policy
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - D:/MnemoscapeInfra/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [infra-net]

# ----------------------------------------------------------------------------
# Nacos 2.3 — 服务注册中心 / 配置中心
# UI: http://100.66.166.46:8848/nacos (匿名访问,生产环境记得打开鉴权)
# ----------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mnemoscape-nacos
    <<: *restart-policy
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      <<: *tz
      MODE: standalone
      PREFER_HOST_MODE: ip
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - D:/MnemoscapeInfra/nacos/data:/home/nacos/data
      - D:/MnemoscapeInfra/nacos/logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [infra-net]

# ----------------------------------------------------------------------------
# RabbitMQ 3.12 — 异步消息总线
# 管理 UI: http://100.66.166.46:15672 (guest / guest)
# 队列定义自动加载 definitions.json (在 mnemoscape.memory / .ai / .notification 三个交换机)
# ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mnemoscape-rabbitmq
    <<: *restart-policy
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      <<: *tz
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - D:/MnemoscapeInfra/rabbitmq/data:/var/lib/rabbitmq
      - D:/MnemoscapeInfra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - D:/MnemoscapeInfra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [infra-net]

# ----------------------------------------------------------------------------
# MinIO — 对象存储 (S3 兼容),给 asset-service 用
# 控制台: http://100.66.166.46:9001 (minioadmin / minioadmin123)
# S3 API: http://100.66.166.46:9000
# ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: mnemoscape-minio
    <<: *restart-policy
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      <<: *tz
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER_REDIRECT_URL: http://100.66.166.46:9001
    command: server /data --console-address ":9001"
    volumes:
      - D:/MnemoscapeInfra/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [infra-net]

# 首次启动后帮你建好 mnemoscape-assets 这个 bucket
  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: mnemoscape-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb local/mnemoscape-assets --ignore-existing &&
      mc anonymous set download local/mnemoscape-assets &&
      echo 'bucket mnemoscape-assets ready';
      exit 0
      "
    networks: [infra-net]

# ----------------------------------------------------------------------------
# Neo4j 5 — 记忆关联图谱
# 浏览器: http://100.66.166.46:7474 (neo4j / password123)
# Bolt:   bolt://100.66.166.46:7687
# ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: mnemoscape-neo4j
    <<: *restart-policy
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      <<: *tz
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - D:/MnemoscapeInfra/neo4j/data:/data
      - D:/MnemoscapeInfra/neo4j/logs:/logs
      - D:/MnemoscapeInfra/neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [infra-net]

# ----------------------------------------------------------------------------
# etcd — Milvus 的元数据存储 (Milvus 必需,不对外暴露)
# ----------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: mnemoscape-etcd
    <<: *restart-policy
    environment:
      <<: *tz
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --name=mnemoscape-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://mnemoscape-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://mnemoscape-etcd:2380
      - --initial-cluster=mnemoscape-etcd=http://mnemoscape-etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=mnemoscape-cluster
    volumes:
      - D:/MnemoscapeInfra/etcd/data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [infra-net]

# ----------------------------------------------------------------------------
# Milvus 2.3 — 情绪向量数据库 (1536 维 emotion vector)
# gRPC: 100.66.166.46:19530   健康检查: http://100.66.166.46:9091/healthz
# 占资源比较多 (~3-4G 内存),如果机器吃紧可以临时注释掉
# ----------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.3.21
    container_name: mnemoscape-milvus
    <<: *restart-policy
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    environment:
      <<: *tz
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin123
      COMMON_STORAGETYPE: minio
    volumes:
      - D:/MnemoscapeInfra/milvus/data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [infra-net]

# ============================================================================
networks:
  infra-net:
    name: mnemoscape-infra-net
    driver: bridge
